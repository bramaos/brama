# Two Servers Brama can reach, on one network.
#
# Same image, different seed size: staging is the smaller of the two so a Pull has
# real data to overwrite and a Recovery point to prove, which an empty target never
# would.
#
# Run it from this directory, or with `make testenv-up` from the repo root.

name: brama-testenv

x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

# The database is identical on both Servers — same name, same user, same password —
# because what makes them different is the data seeded into it, not how it is
# reached. Anchored so it stays that way.
#
# The password is not a secret: these Servers listen on the loopback interface only
# and hold nothing but rows `make testenv-seed` generated.
x-database-env: &database-env
  BRAMA_TESTENV_DB_NAME: wordpress
  BRAMA_TESTENV_DB_USER: wordpress
  BRAMA_TESTENV_DB_PASSWORD: ${TESTENV_DB_PASSWORD:-brama-testenv}

# Everything else the two Servers share. An anchor is worth it here because the block
# is long and the two Servers differ only in their name, their ports and how much
# data is seeded into them — the moment they drift apart by hand, one stops being a
# control for the other.
x-server: &server
  build:
    context: .
    target: server
  image: brama-testenv:1
  # systemd owns PID 1, and on this host's cgroup v1 engine that needs the host
  # hierarchy mounted writable and real tmpfs at /run. Privileged is the cost of
  # testing against a Server that boots services the way a rented one does.
  # See docs/adr/0008-test-against-containerised-servers.md.
  privileged: true
  cgroup: host
  tmpfs:
    - /run
    - /run/lock
  volumes:
    - /sys/fs/cgroup:/sys/fs/cgroup:rw
    # Generated by `make testenv-ssh-setup`, gitignored, mounted read-only. The
    # image holds no key of its own, so regenerating the pair needs no rebuild.
    - ./ssh/id_ed25519.pub:/opt/brama-testenv/authorized_keys:ro
  stop_grace_period: 30s
  restart: unless-stopped
  logging: *logging
  networks:
    - testenv
  deploy:
    resources:
      limits:
        cpus: "1.5"
        memory: 1536M
        pids: 400
      reservations:
        memory: 256M

services:
  production:
    <<: *server
    hostname: brama-testenv-production
    container_name: brama-testenv-production
    environment:
      <<: *database-env
      BRAMA_TESTENV_ROLE: production
      BRAMA_TESTENV_URL: http://localhost:${PRODUCTION_HTTP_PORT:-8081}
    ports:
      # Bound to the loopback interface, never 0.0.0.0: a Server with passwordless
      # sudo must not be reachable from the network the laptop is on.
      - "127.0.0.1:${PRODUCTION_SSH_PORT:-2201}:22"
      - "127.0.0.1:${PRODUCTION_HTTP_PORT:-8081}:80"

  staging:
    <<: *server
    hostname: brama-testenv-staging
    container_name: brama-testenv-staging
    environment:
      <<: *database-env
      BRAMA_TESTENV_ROLE: staging
      BRAMA_TESTENV_URL: http://localhost:${STAGING_HTTP_PORT:-8082}
    ports:
      - "127.0.0.1:${STAGING_SSH_PORT:-2202}:22"
      - "127.0.0.1:${STAGING_HTTP_PORT:-8082}:80"

  # Not a Server. This is a bare PostgreSQL for the postgres introspector to be
  # measured against, and nothing else in the rig uses it: WordPress does not run on
  # PostgreSQL, so there is no site to put in front of it and no Shim story to
  # rehearse. It exists because the four pg_catalog queries are strings, and a string
  # is valid SQL right up until a server disagrees.
  #
  # It publishes its port, which the Servers deliberately do not. The reason they do
  # not is that they hold a `deploy` user with passwordless sudo; this holds a
  # throwaway database and no shell worth reaching, so an ssh tunnel would buy
  # nothing and cost the test a moving part.
  #
  # Pinned to a major version so that what the test asserts about format_type and
  # attgenerated is the same answer on every machine.
  postgres:
    image: postgres:18-alpine
    container_name: brama-testenv-postgres
    environment:
      POSTGRES_DB: wordpress
      POSTGRES_USER: wordpress
      POSTGRES_PASSWORD: ${TESTENV_DB_PASSWORD:-brama-testenv}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    # --wait needs something to wait on, and a TCP connect is not it: postgres
    # accepts connections briefly during initdb, before the database exists.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordpress -d wordpress"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 10s
    restart: unless-stopped
    logging: *logging
    networks:
      - testenv
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

networks:
  testenv:
    driver: bridge

# Bedrock's web root is web/, not the project root: everything above it — .env
# included — must stay unreachable over HTTP, which is the whole reason the layout
# exists.

# Set globally, not per-vhost: without it Apache warns on every start that it cannot
# determine the server's FQDN, which in a container it never can.
ServerName localhost

<VirtualHost *:80>
	DocumentRoot /srv/www/bedrock/web

	<Directory /srv/www/bedrock/web>
		Options -Indexes +FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>

	# Logs to files under /var/log, where a rented Server puts them, and not to the
	# container's stdout. Apache started by systemd has the journal on fd 1, and
	# opening /dev/stdout — a symlink to that socket — as a log file is a startup
	# failure rather than a redirect. `journalctl -u apache2` inside the Server is
	# where the service's own output goes.
	ErrorLog ${APACHE_LOG_DIR}/brama-testenv-error.log
	CustomLog ${APACHE_LOG_DIR}/brama-testenv-access.log combined
</VirtualHost>

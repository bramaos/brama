# A Server accepts a key and nothing else.
#
# Passwords are off so a rig that has lost its authorized_keys fails closed instead
# of sitting at a prompt, and root login is off so `deploy` plus sudo is the only way
# in — which is the permission path the Shim install is meant to exercise.

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes

# Nothing here talks to the outside world, and DNS in a container bridge network is
# slow enough to show up in every connection.
UseDNS no

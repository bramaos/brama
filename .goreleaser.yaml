# How a brama release is built. `make release-snapshot` runs this locally without
# publishing; .github/workflows/release.yml runs it from a tag.
#
# The version here and the version the Makefile stamps are the same string in the
# same symbol: goreleaser takes it from the tag, the Makefile from `git describe`,
# and both write it to main.version. A binary from either route answers `brama
# version` the same way.
version: 2

project_name: brama

before:
  hooks:
    # Fails the release rather than quietly publishing from a tree whose go.mod does
    # not match its imports.
    - go mod tidy -diff
    # The shims are embedded into every brama built below, so they have to exist
    # before any of those builds start. internal/shim/bin ships a placeholder that
    # lets a checkout compile; releasing that placeholder would ship a brama that
    # cannot install a shim.
    - make shim

builds:
  - id: brama
    main: ./cmd/brama
    binary: brama
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # Matches the Makefile's LDFLAGS. -s -w because a released binary is not the one
    # anyone debugs; the source at the tag is.
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # Where brama itself runs: an operator's machine. The servers it reaches are
    # covered by SHIM_PLATFORMS in the Makefile, not by this list. Windows is absent
    # because nothing tests it — CI runs ubuntu and macos — and an untested binary
    # is worse than no binary.
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: brama
    formats:
      - tar.gz
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

sboms:
  # One per archive, so what is published alongside a download describes that
  # download. Generated by syft, which release.yml installs.
  - id: archive
    artifacts: archive

changelog:
  # CHANGELOG.md is written by hand, to Keep a Changelog, and it is the record this
  # project keeps — see docs/agents/changelog.md. The release workflow passes the
  # section for the tag as the release notes, so a generated commit list here would
  # only be a second, worse copy.
  disable: true

release:
  # A release exists before its notes are checked. Tagging is the commit that
  # publishes; nothing else should be.
  draft: false
  prerelease: auto
  # Literal rather than {{ .Env.GITHUB_REPOSITORY }}: that variable exists only
  # inside Actions, and `make release-snapshot` has to render this file too.
  footer: |
    ---
    Verify a download's provenance:

    ```
    gh attestation verify <file> --repo bramaos/brama
    ```

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Defined in its own reusable workflow so the version pin and the runner matrix
  # live in one place.
  lint:
    uses: bramaos/brama/.github/workflows/lint.yml@main

  # Separate from the linters: this reports on the outside world rather than on the
  # commit, so it can go red without the tree having changed.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

        # Pinned to match the Makefile. The vulnerability database is fetched live
        # either way, so this pins the scanner, not what it knows about.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  check:
    name: build, vet, test, cross-build the shim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          # Single source of truth for the Go version: go.mod.
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd. Run 'make fmt'."
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # `go build ./...` compiles cmd/brama-shim for this runner and nothing else, so
      # a change that breaks the linux/arm64 cross-build ships silently and fails on
      # the first arm64 server that registers. Both architectures are built here, and
      # the tests below then run against the real binaries rather than skipping.
      - name: make shim
        run: make shim

      - name: go test
        run: go test -race ./...

      # The tests above read the embedded builds; this proves the last step of
      # distribution, that a brama carrying them still links and runs.
      - name: make binary
        run: |
          make binary
          ./bin/brama version

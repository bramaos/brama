name: lint

# A reusable workflow rather than a triggered one: the lint step is defined once,
# with one version pin, and ci.yml calls it. Callers supply nothing in the normal
# case — the defaults below are brama's.
on:
  workflow_call:
    inputs:
      golangci_path:
        type: string
        required: false
        default: .golangci.yml
        description: Path to the golangci-lint config.
      golangci_version:
        type: string
        required: false
        # Empty means "ask the Makefile". The pin lives in GOLANGCI_VERSION there
        # and nowhere else, so a bump is one edit rather than two that can be made
        # separately and disagree. A caller outside brama can still pass a version.
        default: ''
        description: >-
          Version of golangci-lint to run. Empty reads GOLANGCI_VERSION from the
          Makefile.
      timeout:
        type: string
        required: false
        default: 10m
        description: Timeout passed to golangci-lint.
      os:
        type: string
        required: false
        # Single runner by default: brama has no build tags and no GOOS-specific
        # files, so a wider matrix would lint identical code more than once.
        default: '["ubuntu-latest"]'
        description: JSON array of runners to lint on.

permissions:
  contents: read

jobs:
  golangci-lint:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    runs-on: ${{ matrix.os }}
    # golangci-lint on a cold cache takes about three minutes. Ten is room for a
    # slow runner; past that the job is hung, and a hung job holds a runner for six
    # hours by default.
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit, not a tag: a tag can be moved to point at
      # different code, and these run with a token in the environment. Dependabot
      # bumps the SHA and rewrites the comment, so the version stays readable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes. Leaving the token in .git/config would make it
          # reachable from any command the linters run.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Single source of truth for the Go version: go.mod.
          go-version-file: go.mod
          cache: true

      # Reads the pin out of the Makefile so this workflow does not hold a copy of
      # it. Skipped when a caller passed a version explicitly.
      - id: pin
        if: inputs.golangci_version == ''
        run: echo "version=$(make print-GOLANGCI_VERSION)" >>"$GITHUB_OUTPUT"

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ inputs.golangci_version || steps.pin.outputs.version }}
          args: --config=${{ inputs.golangci_path }} --timeout=${{ inputs.timeout }} ./...

name: security

# Everything here reports on the outside world rather than on the tree: a new
# advisory, a new transitive dependency, a repository setting that changed. That is
# why it is a workflow of its own, on a schedule as well as on pull requests — a
# finding that only arrives when someone happens to push is a finding that a quiet
# week hides.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday, 06:00 UTC. Early enough that the week starts with a current answer.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # CodeQL reads further than the linters do: gosec runs inside golangci-lint on one
  # package at a time, while this follows a tainted value across package boundaries.
  # Free here because the repository is public.
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The only permission in this repository that writes anything. Scoped to this
      # job so the rest of the workflow cannot use it.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: go
          build-mode: autobuild
          # security-extended adds the rules that are accurate but slower. brama is
          # a few thousand lines; the extra minutes are affordable and the extra
          # rules are the ones that matter for something that opens SSH sessions.
          queries: security-extended

      - uses: github/codeql-action/analyze@4bd7200e1f146b1c937cae12d258b50f41a53cf8 # v4.38.0
        with:
          category: /language:go

  # What arrived in this pull request, specifically. govulncheck answers "is the code
  # we call vulnerable"; this answers "is the diff adding something we should not
  # take", including licences, before it is merged rather than after.
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # brama ships under Apache-2.0. A copyleft dependency would make the
          # binary undistributable on the terms the LICENSE file states.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-3.0

  # The same scan ci.yml runs per commit, run again on the schedule. The tree does not
  # change between the two; the vulnerability database does, and this is what notices
  # in a week when nobody pushed.
  govulncheck:
    name: govulncheck (scheduled)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - run: make vuln

  # Grades the repository itself rather than the code: unpinned actions, missing
  # branch protection, tokens with more permission than a job needs. Publishes to the
  # Security tab, so the score is somewhere other than a badge.
  scorecard:
    name: scorecard
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      # Scorecard signs its results so a published score can be traced to this run.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@4bd7200e1f146b1c937cae12d258b50f41a53cf8 # v4.38.0
        with:
          sarif_file: scorecard.sarif

# What a Dependabot pull request touches, stated as a label, so the list of open
# pull requests can be read without opening each one. Paths rather than titles:
# Dependabot's titles say `ci:` for a workflow bump whether or not that is the part
# of the tree it moved.
#
# Only Dependabot's — see the note at the top of .github/workflows/labeler.yml.
#
# Consumed by .github/workflows/labeler.yml. Every label named here must already
# exist in the repository — the labeler creates none of them, it only applies what
# is there, and a name with a typo is silently dropped rather than reported.

# The language, so a bump to go.mod is distinguishable at a glance from a bump to an
# action pin. Both arrive as `dependencies`; only this says which ecosystem moved.
go:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.go'
          - go.mod
          - go.sum
          - .golangci.yml

github-actions:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**
          - .github/actions/**

# Anything that changes what a dependency resolves to. Dependabot sets this label
# itself from .github/dependabot.yml; this line is what still labels a Dependabot
# pull request if the label assignment there ever fails quietly.
#
# It does not catch a hand-written bump: the workflow runs on Dependabot's pull
# requests and no others. A bump someone opened by hand is one they can describe.
dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - go.mod
          - go.sum
          - .github/workflows/**

# How the tree is built and checked, as opposed to what it builds.
ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**
          - .github/rulesets/**
          - .github/dependabot.yml
          - .github/labeler.yml
          - Makefile
          - .goreleaser.yaml
          - .golangci.yml

tests:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*_test.go'
          - test/**
          - testdata/**

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - docs/**
          - learn/**
